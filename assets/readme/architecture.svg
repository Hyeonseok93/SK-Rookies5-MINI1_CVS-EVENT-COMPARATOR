  <text x="770" y="468" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Lite RAG</text>
  <text x="770" y="486" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">catalog match</text>
