<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-label="CVS System Architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0FDFA"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0D9488" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2DD4BF"/>
    </marker>
  </defs>
  <rect width="920" height="400" rx="20" fill="url(#bg)"/>
  <text x="40" y="42" font-family="Segoe UI, Pretendard, sans-serif" font-size="18" font-weight="700" fill="#134E4A">System Architecture</text>
  <text x="40" y="64" font-family="Segoe UI, Pretendard, sans-serif" font-size="12" fill="#6B7280">CVS Event Comparator - Crawl / Batch / Dashboard / AI Chat</text>

  <g filter="url(#shadow)">
    <rect x="40" y="120" width="150" height="100" rx="14" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.5"/>
  </g>
  <text x="115" y="155" text-anchor="middle" font-family="Segoe UI, Pretendard, sans-serif" font-size="13" font-weight="700" fill="#0F766E">4 Brand Sites</text>
  <text x="115" y="176" text-anchor="middle" font-family="Segoe UI, Pretendard, sans-serif" font-size="11" fill="#6B7280">CU / GS25</text>
  <text x="115" y="194" text-anchor="middle" font-family="Segoe UI, Pretendard, sans-serif" font-size="11" fill="#6B7280">7-Eleven / emart24</text>

  <g filter="url(#shadow)">
    <rect x="250" y="120" width="170" height="100" rx="14" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.5"/>
  </g>
  <text x="335" y="155" text-anchor="middle" font-family="Segoe UI, Pretendard, sans-serif" font-size="13" font-weight="700" fill="#0F766E">Batch Pipeline</text>
  <text x="335" y="176" text-anchor="middle" font-family="Segoe UI, Pretendard, sans-serif" font-size="11" fill="#6B7280">Crawl / Clean</text>
  <text x="335" y="194" text-anchor="middle" font-family="Segoe UI, Pretendard, sans-serif" font-size="11" fill="#6B7280">Categorize / News</text>

  <g filter="url(#shadow)">
    <rect x="480" y="120" width="150" height="100" rx="14" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.5"/>
  </g>
  <text x="555" y="158" text-anchor="middle" font-family="Segoe UI, Pretendard, sans-serif" font-size="13" font-weight="700" fill="#0F766E">CSV Catalog</text>
  <text x="555" y="180" text-anchor="middle" font-family="Segoe UI, Pretendard, sans-serif" font-size="11" fill="#6B7280">raw / cleaned</text>
  <text x="555" y="198" text-anchor="middle" font-family="Segoe UI, Pretendard, sans-serif" font-size="11" fill="#6B7280">categorized</text>

  <g filter="url(#shadow)">
    <rect x="690" y="70" width="190" height="90" rx="14" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.5"/>
  </g>
  <text x="785" y="108" text-anchor="middle" font-family="Segoe UI, Pretendard, sans-serif" font-size="13" font-weight="700" fill="#0F766E">Streamlit App</text>
  <text x="785" y="130" text-anchor="middle" font-family="Segoe UI, Pretendard, sans-serif" font-size="11" fill="#6B7280">Dashboard / Guides</text>

  <g filter="url(#shadow)">
    <rect x="690" y="210" width="190" height="90" rx="14" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.5"/>
  </g>
  <text x="785" y="248" text-anchor="middle" font-family="Segoe UI, Pretendard, sans-serif" font-size="13" font-weight="700" fill="#0F766E">Groq Llama 3.3</text>
  <text x="785" y="270" text-anchor="middle" font-family="Segoe UI, Pretendard, sans-serif" font-size="11" fill="#6B7280">Chatbot / Lite RAG</text>

  <line x1="190" y1="170" x2="250" y2="170" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="170" x2="480" y2="170" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M630 150 C660 150, 660 115, 690 115" fill="none" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M630 190 C660 190, 660 255, 690 255" fill="none" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="162" text-anchor="middle" font-family="Segoe UI, Pretendard, sans-serif" font-size="10" fill="#0D9488">Scrape</text>
  <text x="450" y="162" text-anchor="middle" font-family="Segoe UI, Pretendard, sans-serif" font-size="10" fill="#0D9488">ETL</text>
  <text x="655" y="108" font-family="Segoe UI, Pretendard, sans-serif" font-size="10" fill="#0D9488">Load</text>
  <text x="655" y="248" font-family="Segoe UI, Pretendard, sans-serif" font-size="10" fill="#0D9488">Context</text>
  <text x="40" y="360" font-family="Segoe UI, Pretendard, sans-serif" font-size="11" fill="#6B7280">Daily batch 06:00 KST - UI process separated from crawl pipeline</text>
</svg>
